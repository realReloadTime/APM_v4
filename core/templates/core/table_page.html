<!DOCTYPE html>
{% load static %}
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Базовая страница</title>
    <link rel="stylesheet" href="{% static 'core/css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'core/css/styles.css' %}">
    <script src="{% static 'core/js/config.js' %}"></script>
    <script src="{% static 'core/js/bootstrap.bundle.min.js' %}"></script>
    <script src="{% static 'core/js/loadNavbar.js' %}"></script>
    <script src="{% static 'core/js/loadUserProfile.js' %}"></script>
    <script src="{% static 'core/js/table.js' %}"></script>
</head>
<body>
    <div id="menu"></div>
    <main style="padding-top: 90px;">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <div class="d-flex align-items-center">
                <label for="recordsPerPage" class="me-2">Записей на странице:</label>
                <input type="number" id="recordsPerPage" class="form-control form-control-sm me-2" 
                    style="width: 80px;" min="1" max="1000" value="10">
                <button class="btn btn-primary me-2" data-bs-toggle="modal"
                    data-bs-target="#filterModal">Фильтрация</button>
                <button class="btn btn-primary me-2">Создать отчет</button>
            </div>
            <div class="pagination-info"></div>
        </div>
        <div class="table-responsive">
            <table class="table table-primary table-responsive table-hover">
                <thead>
                    <tr>
                        <th scope="col" width='9%' data-sort="begin">Создано <span class="sort-icon"></span></th>
                        <th scope="col" width='9%' data-sort="loa">ЛПУ <span class="sort-icon"></span></th>
                        <th scope="col" width='17%' data-sort="category">Категория информации <span class="sort-icon"></span></th>
                        <th scope="col" width='19%' data-sort="location">Наименование объекта <span class="sort-icon"></span></th>
                        <th scope="col" width='20%'>Примечание</th>
                        <th scope="col" width='10%' data-sort="end">Закрыто <span class="sort-icon"></span></th>
                        <th scope="col" width='5%'>Вложения</th>
                        <th scope="col" width='6%'>В отчёт</th>
                        <th scope="col" width='5%'></th>
                    </tr>
                </thead>
                <tbody id="eventsTableBody">
                    <td></td>
                    <td></td>
                    <td></td>
                    <td>fkjgj</td>
                    <td></td>
                    <td></td>
                    <td></td>
                    <td></td>
                    <td></td>
                </tbody>
            </table>
        </div>
    </main>
    <footer class="fixed-bottom p-2">
        <ul class="pagination justify-content-center" id="paginationContainer">
            <li class="page-item disabled">
                <a class="page-link prev-page" href="#" tabindex="-1">&lt;</a>
            </li>
            <li class="page-item">
                <a class="page-link next-page" href="#">&gt;</a>
            </li>
        </ul>
    </footer>
    <!--Модальное окно фильтрации-->
    <div id="filterModal" class="modal fade modal-xl" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-body">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <div class="form-check">
                            <input class="form-check-input" id="showAll" name="showEvents" type="radio" checked/>
                            <label class="form-check-label" for="showAll">Показать все</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" id="showEnded" name="showEvents" type="radio" />
                            <label class="form-check-label" for="showEnded">Только завершенные</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" id="showNotEnded" name="showEvents" type="radio" />
                            <label class="form-check-label" for="showNotEnded">Только незавершенные</label>
                        </div>
                    </div>
                    <div class="justify-content-between align-items-center mb-3" style="display: inline-flex;">
                        <label class="me-3" style="white-space: nowrap;">Актуально в период от </label>
                        <input type="datetime-local" class="form-control" min="1970-01-01" id="begin">
                        <label class="mx-3" style="white-space: nowrap;">до </label>
                        <input type="datetime-local" class="form-control" min="1970-01-01" id="end">
                    </div>
                    <div class="internal-block justify-content-between align-items-center mb-3">
                        <label for="categories">Тип обстановки</label>
                        <select class="form-select" id="categoriesFilter" name="categories" 
                            style="width:100%; box-sizing: border-box">
                            <option value="">Все</option>
                        </select>
                    </div>
                    <div class="internal-block justify-content-between align-items-center mb-3">
                        <label for="loas">Филиал</label>
                        <select class="form-select" id="loasFilter" name="loas" style="width:100%; box-sizing: border-box">
                            <option value="">Все</option>
                        </select>
                    </div>
                    <div class="internal-block justify-content-between align-items-center mb-3">
                        <label for="locations">Место возникновения события</label>
                        <select class="form-select"  name="locations" id="locationsFilter" style="width:100%">
                            <option value="">Все</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer internal-block" style=" margin-bottom: 0; display: grid;">
                    <button data-bs-dismiss="modal" class="btn btn-danger"
                        style="min-width: 120px; justify-self: start;">Отменить</button>
                    <button id="saveFilter" class="btn btn-primary" data-bs-dismiss="modal"
                        style="min-width: 120px; justify-self: end;">Сохранить</button>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
