<!DOCTYPE html>
{% load static %}
<html lang="ru">

                    <td></td>

                    <td></td>
                    <td></td>

                </tbody>
            </table>
        </div>
    </main>
    <footer class="fixed-bottom p-2">
    <ul class="pagination justify-content-center" id="paginationContainer">
        <li class="page-item disabled">
            <a class="page-link prev-page" href="#" tabindex="-1">&lt;</a>
        </li>
        <li class="page-item">
            <a class="page-link next-page" href="#">&gt;</a>
        </li>
    </ul>

</html>
