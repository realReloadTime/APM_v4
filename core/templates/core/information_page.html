<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Дополнительная информация</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/bootstrap.bundle.min.js"></script>
</head>
<body>
    <nav class="navbar navbar-expand-xl fixed-top bg-primary">
        <div class="container fluid">
            <button class="navbar-toggler"
                    type="button" data-bs-toggle="collapse"
                    data-bs-target="#main-navbar"
                    aria-controls="main-navbar"
                    aria-expanded="false"
                    aria-label="Toggle navigation"
                    style="padding: 2%;">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div id="navbar-brand">
                <h1><a class="nav-link link-light" href="table_page.html">АРМ СиОО</a></h1>
            </div>
            <div class="collapse navbar-collapse" id="main-navbar">
            <ul class="navbar-nav me-auto">
                <li class="nav-item ">
                    <a class="nav-link link-light" href="form_page.html" aria-current="page">Добавить</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link link-light" href="#">Отфильтровать значения</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link link-light" href="#">Создать отчет</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link link-light" href="#">Обновления</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link link-light" href="#">Обратная связь</a>
                </li>
            </ul>
            </div>
            <div class="navbar-text ms-auto">
                 {{ role }} {{ name }}
            </div>
        </div>
    </nav>
    <main style="padding-top: 90px;">
        <div class="table-responsive" style="width: 80%; margin-left: auto; margin-right: auto; ">
            <table class="table table-responsive table-hover">
                <thead>
                    <tr>
                        <th scope="col">Параметр:</th>
                        <th scope="col">Значение:</th>
                    </tr>
                </thead>
                <tbody>
                    {% for row in table %}
                    <tr class="">
                        <td scope="row">{{par.0}}</td>
                        <td scope="row">{{par.1}}</td>
                    </tr>
                    {% empty %}
                    <tr class="">
                        <td scope="row">0</td>
                        <td scope="row">1</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
        <div class="internal-block">
            <label>Возможные последствия</label>
            <input type="text" class="form-control" disabled/>
        </div>
        <div class="internal-block">
            <label>Принимаемые меры</label>
            <textarea class="form-control" disabled></textarea>
        </div>
        <div class="internal-block">
            <label>Информацию внес:</label>
            <input id="writer-name" type="text" class="form-control" disabled>
        </div>
    </main>
    <footer class="fixed-bottom bg-light p-2">
        <div class="container-fluid">
            <div class="d-flex justify-content-between align-items-center">
                <div>
                    <button class="btn btn-primary btn-lg">Удалить</button>
                </div>
                <div>
                    <a href="table_page.html"><button class="btn btn-primary btn-lg">Ок</button></a>
                </div>
            </div>
        </div>
    </footer>
</body>
</html>
